backend:
  name: github
  repo: idunacaligata/odonata
  branch: main
  base_url: https://decap-cms-github-oauth-api.odonata-auth.workers.dev
media_folder: static/img
public_folder: /img

i18n:
  structure: multiple_files
  locales: [ru]
  default_locale: ru

editor:
  preview: false

collections:
  # ────────────────────────────────────────────────
  # Suborder
  # ────────────────────────────────────────────────
  - name: "suborders"
    label: "Suborders"
    folder: "content/suborders"
    create: true
    path: "{{slug}}/index"
    summary: "{{fields.title}} — {{fields.common_name}}"
    media_folder: ""
    public_folder: ""
    i18n: true
    fields:
      - label: "Suborder name"
        name: "title"
        widget: "string"
        required: true
        hint: "Scientific name, e.g. Anisoptera"
        i18n: duplicate
      - label: "Authority"
        name: "authority"
        widget: "string"
        required: true
        i18n: duplicate
      - label: "Common name"
        name: "common_name"
        widget: "string"
        required: true
        i18n: true
      - { label: "Date", name: "date", widget: "datetime", i18n: true}
      - { label: "Draft", name: "draft", widget: "boolean", default: true}
      - label: "Hero Image"
        name: "hero"
        widget: "object"
        required: false
        i18n: true
        fields:
          - label: "File"
            name: "file"
            widget: "image"
            required: false
            i18n: duplicate
            media_library:
              config:
                multiple: false
          - label: "Caption"
            name: "caption"
            widget: "string"
            required: false
            i18n: true
          - { label: "Link", name: "link", widget: "string", required: false, hint: "e.g. iNaturalist observation link", i18n: duplicate }
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.id}} — {{fields.caption}}"
        fields:
          - { label: "ID", name: "id", widget: "string", hint: "Used in body as {{< image THIS-ID >}}" }
          - label: "File"
            name: "file"
            widget: "image"
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Link", name: "link", widget: "string", required: false, hint: "e.g. iNaturalist observation link", i18n: duplicate }
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        buttons: [ bold, italic, link, bulleted-list, numbered-list ]
        editor_components: [ "image-ref" ]
        hint: "To insert an image from the Images list above, type: {{< image the-id >}}"
  # ────────────────────────────────────────────────
  # Family
  # ────────────────────────────────────────────────
  - name: "families"
    label: "Families"
    folder: "content/families"
    create: true
    path: "{{slug}}/index"
    summary: "{{fields.title}} — {{fields.common_name}}"
    media_folder: ""
    public_folder: ""
    i18n: true
    fields:
      - label: "Suborder"
        name: "suborder"
        widget: "relation"
        collection: "suborders"
        search_fields: [ "title" ]
        value_field: "title"
        display_fields: [ "title" ]
        required: true
        i18n: duplicate
      - label: "Family name"
        name: "title"
        widget: "string"
        required: true
        i18n: duplicate
        hint: "Scientific name, e.g. Aeshnidae"
      - label: "Authority"
        name: "authority"
        widget: "string"
        required: true
        i18n: duplicate
      - label: "Common name"
        name: "common_name"
        widget: "string"
        required: true
        i18n: true
      - { label: "Date", name: "date", widget: "datetime", i18n: true}
      - { label: "Draft", name: "draft", widget: "boolean", default: true}
      - label: "Hero Image"
        name: "hero"
        widget: "object"
        required: false
        i18n: true
        fields:
          - label: "File"
            name: "file"
            widget: "image"
            required: false
            i18n: duplicate
            media_library:
              config:
                multiple: false
          - label: "Caption"
            name: "caption"
            widget: "string"
            required: false
            i18n: true

      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.id}} — {{fields.caption}}"
        fields:
          - { label: "ID", name: "id", widget: "string", hint: "Used in body as {{< image THIS-ID >}}" }
          - label: "File"
            name: "file"
            widget: "image"
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Link", name: "link", widget: "string", required: false, hint: "e.g. iNaturalist observation link", i18n: duplicate }
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        buttons: [ bold, italic, link, bulleted-list, numbered-list ]
        editor_components: [ "image-ref" ]
        hint: "To insert an image from the Images list above, type: {{< image the-id >}}"
  # ────────────────────────────────────────────────
  # Genus
  # ────────────────────────────────────────────────
  - name: "genera"
    label: "Genera"
    folder: "content/genera"
    create: true
    path: "{{slug}}/index"
    summary: "{{fields.family}}: {{fields.title}} — {{fields.common_name}}"
    media_folder: ""
    public_folder: ""
    i18n: true
    fields:
      - label: "Family"
        name: "family"
        widget: "relation"
        collection: "families"
        search_fields: [ "title" ]
        value_field: "title"
        display_fields: [ "title" ]
        required: true
        i18n: duplicate
      - label: "Genus name"
        name: "title"
        widget: "string"
        required: true
        i18n: duplicate
        hint: "Scientific name, e.g. Aeshna"
      - label: "Authority"
        name: "authority"
        widget: "string"
        required: true
        i18n: duplicate
      - label: "Common name"
        name: "common_name"
        widget: "string"
        required: true
        i18n: true
      - { label: "Date", name: "date", widget: "datetime", i18n: true }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - label: "Hero Image"
        name: "hero"
        widget: "object"
        required: false
        i18n: true
        fields:
          - label: "File"
            name: "file"
            widget: "image"
            required: false
            i18n: duplicate
            media_library:
              config:
                multiple: false
          - label: "Caption"
            name: "caption"
            widget: "string"
            required: false
            i18n: true
          - { label: "Link", name: "link", widget: "string", required: false, hint: "e.g. iNaturalist observation link", i18n: duplicate }
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.id}} — {{fields.caption}}"
        fields:
          - { label: "ID", name: "id", widget: "string", hint: "Used in body as {{< image THIS-ID >}}" }
          - label: "File"
            name: "file"
            widget: "image"
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Link", name: "link", widget: "string", required: false, hint: "e.g. iNaturalist observation link", i18n: duplicate }
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        required: false
        buttons: [ bold, italic, link, bulleted-list, numbered-list ]
        editor_components: [ "image-ref" ]
        hint: "To insert an image from the Images list above, type: {{< image the-id >}}"
  # ────────────────────────────────────────────────
  # Species
  # ────────────────────────────────────────────────
  - name: "species"
    label: "Species"
    folder: "content/species"
    create: true
    i18n: true
    summary: "{{fields.genus}} {{fields.species}} — {{fields.common_name}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    fields:
      - label: "Genus"
        name: "genus"
        widget: "relation"
        collection: "genera"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
        required: true
        i18: duplicate

      - label: "Species epithet"
        name: "species"
        widget: "string"
        required: true
        pattern: ["^[a-z-]+$", "Lowercase only, by taxonomic convention"]
        i18: duplicate

      - label: "Authority"
        name: "authority"
        widget: "string"
        required: true
        i18n: duplicate

      - label: "Url"
        name: "title"
        widget: "string"
        required: true
        i18n: duplicate

      - label: "Common name"
        name: "common_name"
        widget: "string"
        required: true
        i18n: true

      - { label: "Date", name: "date", widget: "datetime", i18n: duplicate }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, i18n: duplicate }
      - label: "Hero Image"
        name: "hero"
        widget: "object"
        required: true
        i18n: true
        fields:
          - label: "File"
            name: "file"
            widget: "image"
            required: true
            i18n: duplicate
            media_library:
              config:
                multiple: false
          - label: "Caption"
            name: "caption"
            widget: "string"
            required: false
            i18n: true
          - { label: "Link", name: "link", widget: "string", required: false, hint: "e.g. iNaturalist observation link", i18n: duplicate }
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.id}} — {{fields.caption}}"
        fields:
          - { label: "ID", name: "id", widget: "string", hint: "Used in body as {{< image THIS-ID >}}" }
          - label: "File"
            name: "file"
            widget: "image"
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Link", name: "link", widget: "string", required: false, hint: "e.g. iNaturalist observation link", i18n: duplicate }
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        buttons: [ bold, italic, link, bulleted-list, numbered-list ]
        editor_components: [ "image-ref" ]
        hint: "To insert an image from the Images list above, type: {{< image the-id >}}"
  # ────────────────────────────────────────────────
  # Article — simple content type
  # ────────────────────────────────────────────────
  - name: "articles"
    label: "Articles"
    folder: "content/articles"
    create: true
    i18n: true
    path: "{{slug}}/index"
    summary: "{{fields.title}} — {{fields.name}}"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Url", name: "title", widget: "string", required: true, i18n: duplicate }
      - { label: "Name", name: "name", widget: "string", required: true, i18n: true }
      - { label: "Date", name: "date", widget: "datetime", i18n: true }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, i18n: true }
      - label: "Hero Image"
        name: "hero"
        widget: "object"
        required: false
        i18n: true
        fields:
          - label: "File"
            name: "file"
            widget: "image"
            required: false
            i18n: duplicate
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false, i18n: duplicate }
          - { label: "Link", name: "link", widget: "string", required: false, hint: "e.g. iNaturalist observation link", i18n: duplicate }
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.id}} — {{fields.caption}}"
        fields:
          - { label: "ID", name: "id", widget: "string", hint: "Used in body as {{< image THIS-ID >}}" }
          - label: "File"
            name: "file"
            widget: "image"
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Link", name: "link", widget: "string", required: false, hint: "e.g. iNaturalist observation link", i18n: duplicate }
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        buttons: [ bold, italic, link, bulleted-list, numbered-list]
        editor_components: [ "image-ref" ]
        hint: "To insert an image from the Images list above, type: {{< image the-id >}}"