backend:
  name: github
  repo: idunacaligata/odonata
  branch: main
  base_url: https://decap-cms-github-oauth-api.odonata-auth.workers.dev
media_folder: static/img
public_folder: /img

i18n:
  structure: multiple_files
  locales: [ru]
  default_locale: ru

collections:
  # ────────────────────────────────────────────────
  # Suborder
  # ────────────────────────────────────────────────
  - name: "suborders"
    label: "Suborders"
    folder: "content/suborders"
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    i18n: true
    fields:
      - label: "Suborder name"
        name: "title"
        widget: "string"
        required: true
        hint: "Scientific name, e.g. Anisoptera"
        i18n: duplicate
      - label: "Authority"
        name: "authority"
        widget: "string"
        required: true
        i18n: duplicate
      - label: "Common name"
        name: "common_name"
        widget: "string"
        required: true
        i18n: true
      - { label: "Date", name: "date", widget: "datetime", i18n: true}
      - { label: "Draft", name: "draft", widget: "boolean", default: true}
      - label: "Hero Image"
        name: "hero"
        widget: "object"
        required: true
        i18n: true
        fields:
          - label: "File"
            name: "file"
            widget: "image"
            required: true
            i18n: duplicate
            media_library:
              config:
                multiple: false
          - label: "Caption"
            name: "caption"
            widget: "string"
            required: false
            i18n: true
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.id}} — {{fields.caption}}"
        fields:
          - { label: "ID", name: "id", widget: "string", hint: "Used in body as {{< image THIS-ID >}}" }
          - label: "File"
            name: "file"
            widget: "image"
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        hint: "To insert an image from the Images list above, type: {{< image the-id >}}"
  # ────────────────────────────────────────────────
  # Article — simple content type
  # ────────────────────────────────────────────────
  - name: "articles"
    label: "Articles"
    folder: "content/articles"
    create: true
    i18n: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Title", name: "title", widget: "string", required: true, i18n: duplicate }
      - { label: "Name", name: "name", widget: "string", required: true, i18n: true }
      - { label: "Date", name: "date", widget: "datetime", i18n: true }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, i18n: true }
      - label: "Hero Image"
        name: "hero"
        widget: "object"
        required: true
        i18n: true
        fields:
          - label: "File"
            name: "file"
            widget: "image"
            required: true
            i18n: duplicate
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false, i18n: duplicate }
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.id}} — {{fields.caption}}"
        fields:
          - { label: "ID", name: "id", widget: "string", hint: "Used in body as {{< image THIS-ID >}}" }
          - label: "File"
            name: "file"
            widget: "image"
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        hint: "To insert an image from the Images list above, type: {{< image the-id >}}"