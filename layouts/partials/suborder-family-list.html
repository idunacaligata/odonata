{{ $suborder := .Page.Params.title }}

<ul class="species-list">
    {{ range sort (where (where site.RegularPages "Section" "families") ".Params.suborder" $suborder) ".Params.title" }}
    <li>
        <a href="{{ .RelPermalink }}">
            <em>{{ .Params.title }}</em>
            ({{ .Params.common_name }})
        </a>
    </li>
    {{ end }}
</ul>
